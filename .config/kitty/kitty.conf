# Font
font_family      Hack Nerd Font
bold_font        Hack Nerd Font Bold
italic_font      Hack Nerd Font Italic
bold_italic_font Hack Nerd Font Bold Italic
font_size        11.0

# Cursor
cursor_shape     block
cursor_blink_interval 0

# Window
window_padding_width 8
hide_window_decorations yes

# Colors — dark blue/teal retrofuturistic base
background            #0a1628
foreground            #c0caf5
cursor                #7dcfff
selection_background  #1a2f4a

color0  #1a1b26
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #c0caf5
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# Bell
enable_audio_bell no
