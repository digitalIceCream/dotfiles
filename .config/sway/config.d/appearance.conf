# appearance.conf
# Visual styling for sway — borders, gaps, and window colors
# Colors follow Tokyo Night palette to match term

# Border style and thickness
default_border pixel 2
default_floating_border pixel 2

# Gaps between windows and screen edges
gaps inner 8
gaps outer 4

# Window colors
# Syntax: client.STATE border background text indicator child_border
#
# border       = the thin border line
# background   = titlebar background (mostly invisible with pixel borders)
# text         = titlebar text
# indicator    = shows where next split will open
# child_border = the actual visible border around the window

client.focused          #7dcfff #0a1628 #c0caf5 #7dcfff #7dcfff
client.focused_inactive #1a2f4a #0a1628 #5c6a8a #1a2f4a #1a2f4a
client.unfocused        #1a1b26 #0a1628 #414868 #1a1b26 #1a1b26
client.urgent           #f7768e #0a1628 #f7768e #f7768e #f7768e
