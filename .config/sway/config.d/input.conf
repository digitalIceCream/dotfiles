# input.conf - hardware input config for t480s
#
# You can get the names of your inputs by running: swaymsg -t get_inputs
# Read `man 5 sway-input` for more information about this section.

# Keyboard layout
input "type:keyboard" {
    xkb_layout de
    xkb_variant nodeadkeys
}

# Logitech G502 X LS
input "1133:16543:Logitech_G502_X_LS" {
    accel_profile flat
    pointer_accel 0
}

# Touchpad (for t480s compatibility)
input "type:touchpad" {
    tap enabled
    natural_scroll enabled
    middle_emulation enabled
    dwt enabled
}

# Elan TrackPoint
input "1267:32:Elan_TrackPoint" {
    pointer_accel 0.5
    accel_profile adaptive
}
